# acc e2e 专用配置：独立端口/日志目录，单 worker 前台运行
# 注意：metrics_dir 行尾的空格即"空值"（键值按空白切分），表示禁用指标写盘

log_level 2
log_path /tmp/acc_e2e_logs/
enable_daemon no
worker_process 1
connections_per_worker 64

server 127.0.0.1
tcp_port 11883
tls_port 18883
cert_file conf/cert.pem
key_file  conf/key.pem

accept_mutex no
accept_mutex_delay_ms 500
client_timeout 300s
max_read_buffer_size 1m
max_open_fd 4096

thread_pool_thread_num 2
thread_pool_queue_size 100
metrics_dir 
