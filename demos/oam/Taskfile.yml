version: "3"

# OAM 控制器的任务入口。工具（controller-gen 等）通过 `go run pkg@version`
# 按需拉取固定版本，无需全局安装。

vars:
  BIN_DIR: bin
  BINARY: manager
  MAIN_PKG: ./cmd
  # 镜像地址，按需覆盖：task docker-build IMG=registry/oam-controller:v1.0.0
  IMG: oam-controller:latest
  # 工具版本（与 go.mod 中 controller-runtime 版本配套）
  CONTROLLER_TOOLS_VERSION: v0.19.0
  SETUP_ENVTEST_VERSION: v0.25.1
  ENVTEST_K8S_VERSION: 1.34.0
  CONTROLLER_GEN: go run sigs.k8s.io/controller-tools/cmd/controller-gen@{{.CONTROLLER_TOOLS_VERSION}}

tasks:
  default:
    desc: 列出所有任务
    silent: true
    cmds:
      - task --list

  manifests:
    desc: 生成 CRD 与 RBAC 清单（api 类型或 rbac 标记变化后执行）
    cmds:
      - "{{.CONTROLLER_GEN}} crd rbac:roleName=manager-role paths='./...' output:crd:artifacts:config=config/crd/bases output:rbac:artifacts:config=config/rbac"

  generate:
    desc: 生成 DeepCopy 等代码（修改 api/ 下类型后必须执行）
    sources:
      - api/**/*.go
    generates:
      - api/**/zz_generated.deepcopy.go
    cmds:
      - "{{.CONTROLLER_GEN}} object:headerFile='hack/boilerplate.go.txt' paths='./...'"

  fmt:
    desc: 格式化代码
    cmds:
      - go fmt ./...

  vet:
    desc: 静态检查
    cmds:
      - go vet ./...

  lint:
    desc: 运行 golangci-lint（需已安装）
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint 未安装，参见 https://golangci-lint.run/welcome/install/"
    cmds:
      - golangci-lint run ./...

  tidy:
    desc: 整理依赖
    cmds:
      - go mod tidy

  test:
    desc: 运行测试（未配置 KUBEBUILDER_ASSETS 时自动跳过 envtest 集成用例）
    env:
      KUBEBUILDER_ASSETS: "{{.KUBEBUILDER_ASSETS}}"
    cmds:
      - go test {{.TEST_FLAGS -}} ./...

  test-envtest:
    desc: 运行全部测试，含 envtest 集成用例（自动下载测试用控制面二进制）
    cmds:
      - KUBEBUILDER_ASSETS="$$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@{{.SETUP_ENVTEST_VERSION}} use {{.ENVTEST_K8S_VERSION}} -p path)" go test {{.TEST_FLAGS -}} ./...

  build:
    desc: 编译控制器二进制到 {{.BIN_DIR}}/{{.BINARY}}
    deps: [generate]
    sources:
      - "**/*.go"
    generates:
      - "{{.BIN_DIR}}/{{.BINARY}}"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/{{.BINARY}} {{.MAIN_PKG}}

  run:
    desc: 本地运行控制器（需 kubeconfig 指向目标集群）
    deps: [generate]
    cmds:
      - go run {{.MAIN_PKG}} {{.CLI_ARGS}}

  docker-build:
    desc: 构建控制器镜像（可用 IMG=xxx:tag 覆盖）
    cmds:
      - docker build -t {{.IMG}} .

  docker-push:
    desc: 推送控制器镜像
    cmds:
      - docker push {{.IMG}}

  install:
    desc: 安装 CRD 到集群
    cmds:
      - kubectl apply -k config/crd

  uninstall:
    desc: 从集群卸载 CRD
    cmds:
      - kubectl delete -k config/crd --ignore-not-found

  deploy:
    desc: 部署控制器（kustomize config/default，需先 task docker-build IMG=<镜像>）
    cmds:
      - cd config/manager && kustomize edit set image controller={{.IMG}}
      - kubectl apply -k config/default

  undeploy:
    desc: 卸载控制器
    cmds:
      - kubectl delete -k config/default --ignore-not-found

  clean:
    desc: 清理构建产物
    cmds:
      - rm -rf {{.BIN_DIR}}

  check:
    desc: 本地提交前检查：generate + manifests + fmt + vet + test
    cmds:
      - task: generate
      - task: manifests
      - task: fmt
      - task: vet
      - task: test
