---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: deployunits.oam.example.com
spec:
  group: oam.example.com
  names:
    kind: DeployUnit
    listKind: DeployUnitList
    plural: deployunits
    shortNames:
    - du
    singular: deployunit
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.annotations.oam\.example\.com/controller-version
      name: ControllerVersion
      type: string
    - jsonPath: .metadata.annotations.oam\.example\.com/pause
      name: Paused
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          DeployUnit 是 OAM 应用部署声明的入口：由若干 Component 及其 Trait 组成，
          控制器将其渲染为 Kubernetes 原生资源并以三路合并方式持续同步。
          上次成功应用的快照写入同名的 DeployUnitHistory，作为下次合并的 lastApplied。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DeployUnitSpec 定义 DeployUnit 的期望状态。
            properties:
              components:
                description: Components 组成该 DeployUnit 的组件列表，每项独立渲染后合并入最终资源集合。
                items:
                  description: |-
                    DeployUnitComponent 描述应用的一个组件。

                    每个 Component 由对应工厂（internal/render/component/components，
                    通过 init() 自注册）渲染为一组 Kubernetes 原生资源，
                    例如 stateless -> Deployment、stateful -> StatefulSet。
                  properties:
                    name:
                      description: |-
                        Name 组件名称，在同一 DeployUnit 内需唯一。
                        渲染出的工作负载主容器与资源命名均使用该名称。
                      type: string
                    properties:
                      description: |-
                        Properties 组件属性，以原始 JSON 存储，由对应工厂自行
                        反序列化为具体 spec 结构（见 components.WorkloadSpec）。
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    traits:
                      description: |-
                        Traits 作用于本组件的 trait 列表。实际执行时按 trait.GetOrder()
                        升序依次 Apply，order 越大越靠后执行，后者可覆盖前者设置的字段。
                      items:
                        description: |-
                          DeployUnitTrait 定义作用于某个 Component 的增强能力。

                          Trait 不直接产出资源，而是在 Component 已渲染出的对象列表上做增改，
                          例如 scaler 设置副本数、sidecar 注入边车容器、mount 挂载配置。
                          工厂见 internal/render/trait/traits，通过 init() 自注册。
                        properties:
                          properties:
                            description: Properties trait 属性，以原始 JSON 存储，由对应工厂自行反序列化。
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          type:
                            description: Type trait 类型，决定使用哪个 Trait 工厂，例如 "scaler"。
                            type: string
                        required:
                        - type
                        type: object
                      type: array
                    type:
                      description: |-
                        Type 组件类型，决定使用哪个 Component 工厂渲染，
                        当前支持 "stateless"、"stateful"。
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
            required:
            - components
            type: object
          status:
            description: |-
              DeployUnitStatus 定义 DeployUnit 的观测状态。

              当前未承载具体字段，应用结果通过注解（reconciled、controller-version）
              而非 status 回写。
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
