# 默认部署组合：CRD + RBAC + 控制器。
# 使用：kubectl apply -k config/default （或 task deploy）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 给所有资源统一加前缀与命名空间。
namePrefix: oam-controller-
namespace: oam-controller-system

labels:
- pairs:
    app.kubernetes.io/name: oam-controller
    app.kubernetes.io/managed-by: kustomize
  includeSelectors: false

resources:
- ../crd
- ../rbac
- ../manager
