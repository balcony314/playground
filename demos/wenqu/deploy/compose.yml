# 多数据源智能查询 Agent 平台 —— 依赖环境一键编排。
# 全部使用公共镜像：Milvus（含 etcd/minio 依赖）、ClickHouse、Elasticsearch、ClickHouse MCP server、
# Ollama（embedding 模型运行时，首次启动自动拉取 bge-m3）+ Embedding/Rerank 协议适配层。
# 用法：cp .env.example .env && docker compose -f deploy/compose.yml up -d
name: datasearch-demo

services:
  # ---- Milvus 依赖：etcd 元数据 / minio 对象存储 ----
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: on-failure

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: on-failure

  # ---- Milvus 向量库：RAG 知识库 ----
  milvus:
    image: milvusdb/milvus:v2.6.1
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    restart: on-failure

  # ---- ClickHouse：结构化数据源（native 9000 / HTTP 8123）----
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DB: demo
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: on-failure

  # ---- ClickHouse MCP server：react agent 的工具提供方（SSE :4200）----
  mcp-clickhouse:
    image: mcp/clickhouse:latest
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      # 8123 为 HTTP 端口，须关闭 HTTPS（镜像默认 secure=true 走 8443）
      CLICKHOUSE_SECURE: "false"
      # SSE transport 配置（镜像默认 stdio，无法提供 :4200 服务）
      CLICKHOUSE_MCP_SERVER_TRANSPORT: sse
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "4200"
    ports:
      - "4200:4200"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: on-failure

  # ---- Elasticsearch 8：全文/日志数据源 ----
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    restart: on-failure

  # ---- Ollama：embedding 模型运行时（bge-m3，CPU 推理即可）----
  # 不映射 11434 到宿主，避免与宿主机已有 Ollama 端口冲突；仅供 compose 网络内访问
  ollama:
    image: ollama/ollama:0.30.10
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure

  # ---- 首次启动拉取 bge-m3（幂等：模型已在卷中则秒过，约 1.2GB 一次性下载）----
  ollama-pull:
    image: ollama/ollama:0.30.10
    entrypoint: ["ollama", "pull", "bge-m3"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ---- Embedding/Rerank 协议适配层（:9999）：自研协议 → Ollama，rerank 恒等 ----
  # 零依赖独立 module，直接用 golang 公共镜像 go run 拉起；
  # healthz 校验 Ollama 存活 + bge-m3 已拉取（deps:wait 依赖它，模型下载期间不误报就绪）
  embedadapter:
    image: golang:1.25-alpine
    working_dir: /src
    command: ["go", "run", "."]
    environment:
      ADAPTER_LISTEN: ":9999"
      OLLAMA_HOST: http://ollama:11434
      EMBED_MODEL: bge-m3
    volumes:
      - ./embedadapter:/src
    ports:
      - "9999:9999"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: on-failure

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  clickhouse_data:
  es_data:
  ollama_data:
